name: Deploy GitHub Pages

# dist/ 不提交進倉庫：這裡在 main 更新時測試、建置，再把產物部署到 Pages。
# loader 讀取 https://awdrrawd.github.io/BC-Responsive/dist/main.js（舊版已安裝的 loader 也是這個路徑），
# 所以要把 dist/ 放在站台的 dist/ 底下，不能直接當站台根目錄。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Stage site
        run: |
          mkdir -p _site/dist
          cp -r dist/. _site/dist/
          cp -r licenses _site/licenses
          cp -r assets _site/assets
          cp loader.user.js _site/loader.user.js
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
